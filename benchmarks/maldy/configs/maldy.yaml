# Config for MalDy: Traditional ML with Feature Engineering
# Methodology: N-grams -> Feature Hashing -> TF-IDF -> Ensemble Learning

paths:
  raw_data: data/raw/MalBehavD-V1-dataset.csv
  processed_data_dir: data/maldy/processed
  features_dir: data/maldy/features
  splits_dir: data/splits
  labels_file: data/intermediate/labels.json
  model_dir: models/maldy

data:
  sha_col: sha256
  label_col: labels
  api_start_col: 2
  train_frac: 0.8
  val_frac: 0.1
  test_frac: 0.1
  seed: 42

features:
  # N-grams configuration
  # Step 1: Create N-grams from API sequences
  ngram_range: [1, 4]  # Unigrams, bigrams, trigrams, 4-grams (increased for better coverage)
  # Can also use [1, 3] for faster processing
  
  # Feature Hashing (HashingVectorizer)
  # Step 2: Apply Feature Hashing to reduce dimensionality
  n_features: 30000  # Increased from 10000 for better feature coverage
  
  # TF-IDF Transformation
  # Step 3: Apply TF-IDF weighting to hashed features
  # (configured in code, no additional params needed)

models:
  # Random Forest
  random_forest:
    enabled: true
    n_estimators: 200  # Increased for better performance
    max_depth: 30       # Increased depth
    min_samples_split: 2
    min_samples_leaf: 1
    random_state: 42
    n_jobs: -1
    class_weight: 'balanced'  # Handle class imbalance
  
  # XGBoost (required for VotingClassifier)
  xgboost:
    enabled: true  # Enabled for VotingClassifier (needs at least 2 models)
    n_estimators: 200  # Increased
    max_depth: 8        # Increased
    learning_rate: 0.05  # Lower learning rate with more estimators
    subsample: 0.9      # Increased
    colsample_bytree: 0.9  # Increased
    random_state: 42
    n_jobs: -1
  
  # SVM (optional, can add for more diversity)
  svm:
    enabled: true  # Set to true to add SVM to ensemble
    kernel: 'rbf'
    C: 10.0
    gamma: 'scale'
    probability: true
    random_state: 42
    class_weight: 'balanced'

# Ensemble Learning Configuration
ensemble:
  enabled: true
  type: voting  # 'voting' or 'random_forest'
  # If 'voting': Uses VotingClassifier with base models
  # If 'random_forest': Uses RandomForestClassifier directly (it's already an ensemble)
  voting: soft  # 'hard' or 'soft' (only for voting type)
  # Soft voting: averages probabilities
  # Hard voting: majority vote

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - auc_roc
    - confusion_matrix
  save_predictions: true

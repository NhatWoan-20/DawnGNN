# Optimized Config for MalDy: Improved hyperparameters and settings
paths:
  raw_data: data/raw/MalBehavD-V1-dataset.csv
  processed_data_dir: data/maldy/processed
  features_dir: data/maldy/features
  splits_dir: data/splits
  labels_file: data/intermediate/labels.json
  model_dir: models/maldy

data:
  sha_col: sha256
  label_col: labels
  api_start_col: 2
  train_frac: 0.8
  val_frac: 0.1
  test_frac: 0.1
  seed: 42

features:
  # N-grams configuration
  ngram_range: [1, 3]  # Unigrams, bigrams, trigrams
  min_df: 1  # Minimum document frequency
  max_df: 0.95  # Maximum document frequency
  
  # Feature extraction method: 'tfidf' or 'hashing'
  method: 'tfidf'  # Options: 'tfidf', 'hashing'
  
  # For TF-IDF - INCREASED for better feature coverage
  max_features: 10000  # Increased from 5000
  
  # For Hashing
  n_features: 10000  # Increased from 5000
  hash_algorithm: 'md5'  # Hashing algorithm

models:
  # Random Forest - OPTIMIZED
  random_forest:
    enabled: true
    n_estimators: 200  # Increased from 100
    max_depth: 30      # Increased from 20
    min_samples_split: 2  # Decreased from 5
    min_samples_leaf: 1   # Decreased from 2
    random_state: 42
    n_jobs: -1
    class_weight: 'balanced'  # Handle class imbalance
  
  # XGBoost - OPTIMIZED
  xgboost:
    enabled: true
    n_estimators: 200     # Increased from 100
    max_depth: 8          # Increased from 6
    learning_rate: 0.05   # Decreased from 0.1 (with more estimators)
    subsample: 0.9        # Increased from 0.8
    colsample_bytree: 0.9 # Increased from 0.8
    random_state: 42
    n_jobs: -1
    scale_pos_weight: 1.0  # Adjust if class imbalance exists
  
  # SVM - OPTIMIZED
  svm:
    enabled: true
    kernel: 'rbf'  # Options: 'linear', 'rbf', 'poly'
    C: 10.0        # Increased from 1.0
    gamma: 'scale'
    probability: true
    random_state: 42
    class_weight: 'balanced'  # Handle class imbalance

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - auc_roc
    - confusion_matrix
  save_predictions: true

# Ensemble Learning Configuration - USING STACKING
ensemble:
  enabled: true  # Enable ensemble learning (always enabled in training)
  type: stacking  # Changed from 'voting' to 'stacking' for better performance
  voting: soft    # Not used when type=stacking
  # Stacking uses LogisticRegression as meta-learner with 5-fold CV


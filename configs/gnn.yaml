# configs/gnn.yaml - GNN model configuration (tuned to avoid overfitting and maximize accuracy)
paths:
  embeddings_dir: data/embeddings
  input_graphs_dir: data/graphs
  output_augmented_dir: data/graphs_augmented
  labels_file: data/intermediate/labels.json
  splits_dir: data/splits

embedding:
  default_size: 768
  unknown_api_strategy: zeros

model:
  input_dim: 768
  hidden_dim: 128       
  num_layers: 3 
  num_heads: 8  
  dropout: 0.4   
  pooling_type: "mean" 

training:
  learning_rate: 0.0005
  epochs: 100        
  batch_size: 32    
  device: "cuda"
  weight_decay: 0.0005   
  # Early stopping
  early_stopping:
    enabled: false
    patience: 20        
    min_delta: 0.00005    
  # Learning rate scheduler
  lr_scheduler:
    enabled: true
    mode: "min"         
    factor: 0.3        
    patience: 5       
    min_lr: 0.00001  
  # Checkpointing
  checkpoint:
    enabled: true
    save_every: 10
    keep_last: 3     
